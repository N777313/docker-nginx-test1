name: Docker Compose Test and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: n777313/docker-nginx-test1

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Show containers
        run: docker compose ps

      - name: Wait for application
        run: sleep 5

      - name: Test Nginx
        run: curl --fail http://localhost

      - name: Test load balancing
        run: |
          for i in {1..6}; do
            curl --fail http://localhost
          done

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag my-app:latest \
            ghcr.io/n777313/docker-nginx-test1:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/n777313/docker-nginx-test1:latest
