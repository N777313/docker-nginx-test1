services:

  app1:
    image: my-app:latest
    build: .
    environment:
      INSTANCE: app1

  app2:
    image: my-app:latest
    build: .
    environment:
      INSTANCE: app2

  app3:
    image: my-app:latest
    build: .
    environment:
      INSTANCE: app3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
